<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">
<meta name="description" content="폰에 설치해서 쓰는 우리집 가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap">
<style>
/* Layout: one-column phone app — playful title on top, scrolling content, fixed tab bar, bottom-sheet entry form */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --surface-2: #edf1ee;
  --fg: #16201b;
  --muted: #5f6a64;
  --faint: #929c96;
  --line: #e0e6e2;
  --accent: #127a55;
  --accent-ink: #ffffff;
  --accent-soft: #dff1e8;
  --income: #11744f;
  --cash: #4f73c9;
  --warn: #9a5b00;
  --warn-soft: #fcefd6;
  --danger: #c4352d;
  --danger-soft: #fbe4e1;
  --bar: #1a8a61;
  --bar-muted: #c6d6cd;
  --marker: #ffe28a;
  --pig: #f6b3c2;
  --pig-dark: #e98aa1;
  --pig-ink: #7a2e40;
  --coin: #f5c443;
  --coin-ink: #b8860b;
  --scrim: rgba(10, 20, 15, .38);
  --shadow: 0 1px 2px rgba(18, 40, 30, .05), 0 6px 20px rgba(18, 40, 30, .06);
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-fun: "Jua", "IBM Plex Sans KR", system-ui, "Noto Sans KR", sans-serif;
  --r-card: 18px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1311; --surface: #171d1a; --surface-2: #202825; --fg: #e8eeea; --muted: #9ea8a2; --faint: #6c7670; --line: #27302c;
    --accent: #3cc08d; --accent-ink: #052419; --accent-soft: #173a2b; --income: #55d2a0; --cash: #7f9df0;
    --warn: #f0aa45; --warn-soft: #3a2b12; --danger: #f2756d; --danger-soft: #3d1d1a;
    --bar: #3cc08d; --bar-muted: #33413a; --marker: rgba(240, 190, 70, .32);
    --pig: #e99aae; --pig-dark: #d4738c; --pig-ink: #4a1422; --coin: #e8b53a; --coin-ink: #8a6208;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 0 0 1px #222b27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1311; --surface: #171d1a; --surface-2: #202825; --fg: #e8eeea; --muted: #9ea8a2; --faint: #6c7670; --line: #27302c;
  --accent: #3cc08d; --accent-ink: #052419; --accent-soft: #173a2b; --income: #55d2a0; --cash: #7f9df0;
  --warn: #f0aa45; --warn-soft: #3a2b12; --danger: #f2756d; --danger-soft: #3d1d1a;
  --bar: #3cc08d; --bar-muted: #33413a; --marker: rgba(240, 190, 70, .32);
  --pig: #e99aae; --pig-dark: #d4738c; --pig-ink: #4a1422; --coin: #e8b53a; --coin-ink: #8a6208;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 0 0 1px #222b27;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.income { color: var(--income); }

.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(140px + env(safe-area-inset-bottom, 0px)); }

/* title */
.hero { display: block; width: 100%; text-align: center; padding-block: 18px 10px; cursor: pointer; user-select: none; }
.hero-name { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; color: var(--income); }
.hero-name svg { width: 34px; height: 34px; margin-top: -6px; }
.hero-title { font-family: var(--font-fun); font-weight: 400; font-size: clamp(29px, 8.6vw, 38px); line-height: 1.15; margin: 2px 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.hero-title .hl { background: linear-gradient(transparent 56%, var(--marker) 56%, var(--marker) 94%, transparent 94%); padding: 0 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hero-sub { margin: 0; font-size: 13.5px; color: var(--muted); min-height: 20px; }
.hero:active .hero-name svg { transform: rotate(-8deg) scale(1.06); }
.hero-name svg { transition: transform .2s; }

.view { display: flex; flex-direction: column; gap: 12px; }

/* period / month navigation */
.pnav { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 4px; }
.plabel { flex: 1; font-size: 16.5px; font-weight: 700; padding: 6px 8px; border-radius: 10px; text-align: center; }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.icon-btn svg { width: 22px; height: 22px; }
.period { display: flex; flex-direction: column; gap: 8px; }
.range { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.range-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.range-row input { width: 100%; min-width: 0; border: 0; background: var(--surface-2); border-radius: 10px; padding: 10px; font-size: 15px; outline: none; }
.range-row input:focus { box-shadow: 0 0 0 2px var(--accent); }
.range-row span { color: var(--muted); }

/* cards */
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 700; margin: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hint { margin: 0; color: var(--muted); font-size: 13.5px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
.big { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; }
.pay-line { margin: -6px 0 0; font-size: 13.5px; color: var(--muted); }
.pay-line b { color: var(--fg); font-weight: 600; }

.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.kv div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kv dt { font-size: 12.5px; color: var(--muted); }
.kv dd { margin: 2px 0 0; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }

/* budget meter */
.budget { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); }
.budget-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; font-size: 14px; }
.meter { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }
.meter.warn > i { background: var(--warn); }
.meter.over > i { background: var(--danger); }
.budget-sub { margin: 0; font-size: 13.5px; color: var(--muted); }
.budget-sub b { color: var(--fg); font-weight: 600; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--income); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.over { background: var(--danger-soft); color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.link-row { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--income); font-weight: 600; font-size: 14px; }

/* notices */
.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: 13.5px; }
.notice strong { font-weight: 600; }
.notice p { margin: 2px 0 0; color: var(--muted); }
.notice.warn { background: var(--warn-soft); }
.notice.warn strong { color: var(--warn); }
.btn-sm { flex: none; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px; background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }

/* ledger */
.ledger { display: flex; flex-direction: column; gap: 8px; }
.ledger-hint { display: flex; align-items: center; gap: 6px; padding: 2px 4px; }
.ledger-hint svg { width: 15px; height: 15px; flex: none; }
.day { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 6px 6px 8px; }
.day-head { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.day ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 12px; }
.row:hover { background: var(--surface-2); }
.row:active { background: var(--surface-2); }
.mono { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.mono.in { background: var(--accent-soft); color: var(--income); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub .cash { color: var(--cash); font-weight: 500; }
.row-amt { flex: none; font-weight: 600; }
.row-amt.in { color: var(--income); }
.sample-tag { font-size: 11px; font-weight: 600; color: var(--faint); margin-left: 6px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty-title { font-size: 16px; font-weight: 600; color: var(--fg); margin: 0 0 4px; }
.empty p { margin: 0; }

/* stats */
.cat-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.cat-line { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.cat-name { font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--bar); flex: none; }
.dot.k-cash { background: var(--cash); }
.dot.k-none { background: var(--bar-muted); }
.track { height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 99px; background: var(--bar); }
.track > i.over { background: var(--danger); }
.track > i.cash { background: var(--cash); }
.track > i.in { background: var(--income); }
.cat-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.cat-meta .warn { color: var(--warn); font-weight: 600; }
.cat-meta .over { color: var(--danger); font-weight: 600; }
.split { display: flex; gap: 2px; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.split i { display: block; height: 100%; background: var(--bar); }
.split i.k-cash { background: var(--cash); }
.split i.k-none { background: var(--bar-muted); }
.readout { margin: 0; font-size: 14px; min-height: 21px; }
.readout b { font-weight: 600; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--bar); transition: fill .15s; }
.chart.has-sel .bar { fill: var(--bar-muted); }
.chart.has-sel .bar.sel { fill: var(--bar); }
.chart .ref { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
.chart .val { fill: var(--fg); font-weight: 600; font-size: 10.5px; }
.chart .hit { fill: transparent; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 0; border-top: 2px dashed var(--warn); display: inline-block; }
.seg.mini { padding: 3px; border-radius: 10px; }
.seg.mini button { min-height: 30px; font-size: 13px; border-radius: 8px; padding: 0 12px; }
.card-head .seg.mini { display: inline-grid; }
.fold > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; font-weight: 600; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "펼치기"; font-size: 13px; font-weight: 500; color: var(--muted); }
.fold[open] > summary::after { content: "접기"; }
.fold[open] > summary { margin-bottom: 8px; }

/* settings */
.field-row { display: flex; gap: 8px; align-items: stretch; }
.money-input { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: var(--r-ctl); padding: 0 14px; }
.money-input input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; font-size: 16px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.money-input span { color: var(--muted); font-size: 14px; }
.money-input:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.money-input.sm input { padding: 8px 0; font-size: 15px; }
.btn { flex: none; padding: 0 18px; min-height: 46px; border-radius: var(--r-ctl); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-line { width: 100%; min-height: 48px; padding: 0 16px; border-radius: var(--r-ctl); background: var(--surface-2); font-weight: 600; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn-line small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.btn-line.danger { color: var(--danger); }
.btn-col { display: flex; flex-direction: column; gap: 8px; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.note { margin: 0; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }
details.sub { border-top: 1px solid var(--line); padding-top: 12px; }
details.sub summary { cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
details.sub summary::-webkit-details-marker { display: none; }
details.sub summary::after { content: "펼치기"; font-weight: 400; font-size: 13px; }
details.sub[open] summary::after { content: "접기"; }
.cb-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.cb-list label { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: center; font-size: 14px; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--danger-soft); }
.confirm p { margin: 0; font-size: 14px; }
.confirm .acts { display: flex; gap: 8px; }
.confirm .acts button { flex: 1; min-height: 44px; border-radius: 10px; font-weight: 600; background: var(--surface); }
.confirm .acts .yes { background: var(--danger); color: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 38px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 2px; padding: 6px 4px 6px 12px; border-radius: 99px; background: var(--surface-2); font-size: 14px; }
.tag button { width: 26px; height: 26px; border-radius: 99px; color: var(--faint); font-size: 16px; line-height: 1; }
.tag button:hover { color: var(--danger); background: var(--danger-soft); }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { padding: 8px 12px; border-radius: 99px; background: var(--surface-2); font-size: 14px; font-weight: 500; }
.pick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.add-row { display: flex; gap: 8px; }
.text-input { flex: 1; min-width: 0; width: 100%; border: 0; background: var(--surface-2); border-radius: var(--r-ctl); padding: 12px 14px; font-size: 15px; outline: none; }
.text-input:focus { box-shadow: 0 0 0 2px var(--accent); }
.version { text-align: center; font-size: 12.5px; color: var(--faint); margin: 8px 0 0; }

/* FAB + tab bar */
.fab { position: fixed; z-index: 6; right: max(16px, calc(50% - 244px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 54px; padding: 0 22px 0 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 20px rgba(18, 122, 85, .35); }
.fab svg { width: 22px; height: 22px; }
.fab:active { transform: scale(.97); }
.tabbar { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; font-size: 12px; font-weight: 500; color: var(--faint); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] svg { color: var(--accent); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; padding-inline: 18px; padding-block: 8px 0; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 6px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { font-size: 18px; margin: 0; }
#entryForm { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.amount-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding: 4px 2px 6px; }
.amount-field:focus-within { border-color: var(--accent); }
.amount-field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; padding: 0; }
.amount-field input::placeholder { color: var(--faint); }
.amount-field .unit { font-size: 20px; font-weight: 600; color: var(--muted); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { padding: 7px 12px; border-radius: 99px; background: var(--surface-2); font-size: 13.5px; font-weight: 600; }
.field-label { margin: 0 0 -6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.cat-grid button { min-height: 42px; padding: 6px 8px; border-radius: 11px; background: var(--surface-2); font-size: 14px; font-weight: 500; line-height: 1.25; }
.cat-grid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
#paySeg button[data-pay="cash"][aria-pressed="true"] { color: var(--cash); }
#paySeg button[data-pay="card"][aria-pressed="true"] { color: var(--income); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.field input { border: 0; background: var(--surface-2); border-radius: var(--r-ctl); padding: 12px 14px; font-size: 16px; color: var(--fg); outline: none; min-width: 0; width: 100%; }
.field input:focus { box-shadow: 0 0 0 2px var(--accent); }
.date-chips { display: flex; gap: 6px; flex-wrap: wrap; }

  <div class="sheet-head">
    <h2 id="sheetTitle">기록하기</h2>

    </div>
    <label class="amount-field" for="amount">

      <button type="button" data-add="10000">+1만</button>
      <button type="button" data-add="50000">+5만</button>
      <button type="button" data-add="100000">+10만</button>
      <button type="button" data-add="0">지우기</button>

    </div>
    <label class="field" for="memo">메모

    <datalist id="memoList"></datalist>
    <p class="form-error" id="formError" hidden></p>
    <div class="sheet-actions">

      <button type="submit" class="btn-primary" id="saveBtn">저장</button>

  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

var STATE_LABEL = { ok: '여유', warn: '주의', over: '초과' };

/* ---------- install prompt ---------- */
var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', function () { deferredInstall = null; toast('홈 화면에 설치했어요.'); render(); });

/* ---------- render ---------- */
function render() {
  ['home', 'stats', 'settings'].forEach(function (t) { $('view-' + t).hidden = ui.tab !== t; });
  document.querySelectorAll('.tab').forEach(function (b) { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('fab').hidden = ui.tab === 'settings';
  renderHero();
  if (ui.tab === 'home') renderHome();
  else if (ui.tab === 'stats') renderStats();
  else renderSettings();
}

function quip() {
  var b = S.settings.budget, key = 'none';
  if (b > 0) { var p = totals(monthEntries(curYM())).out / b; key = p >= 1 ? 'over' : p >= 0.8 ? 'warn' : p >= 0.5 ? 'mid' : 'ok'; }
  var list = QUIPS[key];
  return list[ui.quip % list.length].replace(/\{n\}/g, S.settings.name || '우리');
}
function renderHero() {
  var n = S.settings.name;
  $('hero').innerHTML = '<div class="hero-name">' + PIG + (n ? '<span>' + esc(n) + '의</span>' : '') + '</div>' +
    '<h1 class="hero-title"><span class="hl">' + esc(S.settings.title) + '</span></h1>' +
    '<p class="hero-sub">' + esc(quip()) + '</p>';
}

function navHTML(prevAct, nextAct, label, todayAct, nextDisabled, prevLabel, nextLabel) {
  return '<div class="pnav"><button class="icon-btn" data-action="' + prevAct + '" aria-label="' + prevLabel + '">' + ICON_L + '</button>' +
    '<button class="plabel" data-action="' + todayAct + '" title="지금으로 돌아가기">' + label + '</button>' +
    '<button class="icon-btn" data-action="' + nextAct + '" aria-label="' + nextLabel + '"' + (nextDisabled ? ' disabled' : '') + '>' + ICON_R + '</button></div>';
}

function installBanner() {
  if (!deferredInstall || standalone || S.settings.hideInstall) return '';
  return '<div class="notice"><div><strong>홈 화면에 앱으로 설치할 수 있어요</strong><p>아이콘을 눌러 바로 열 수 있어요.</p></div><button class="btn-sm" data-action="install">설치</button></div>';
}

function budgetHTML(spent, ym) {
  var b = S.settings.budget;
  if (!(b > 0)) return '<button class="link-row" data-action="goto-settings">한 달 예산을 정하면 남은 금액을 알려드려요<span aria-hidden="true">›</span></button>';
  var st = budgetState(spent, b), pct = usePct(spent, b), sub;
  if (st === 'over') sub = '예산보다 <b class="num">' + won(spent - b) + '</b> 더 썼어요.';
  else {
    sub = '<b class="num">' + won(b - spent) + '</b> 남았어요.';
    if (ym === curYM()) {
      var left = daysIn(ym) - new Date().getDate() + 1;
      sub += ' 오늘 포함 ' + left + '일 동안 하루 약 <b class="num">' + won(perDay((b - spent) / left)) + '</b>쯤 쓸 수 있어요.';
    }
  }
  var h = '<div class="budget"><div class="budget-top"><span>예산 <span class="num">' + won(b) + '</span> 중 <b class="num">' + pct + '%</b> 사용</span><span class="pill ' + st + '">' + STATE_LABEL[st] + '</span></div>' +
    '<div class="meter ' + st + '" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.min(pct, 100) + '" aria-label="예산 사용률"><i style="width:' + Math.min(pct, 100) + '%"></i></div>' +
    '<p class="budget-sub">' + sub + '</p>';
  var cb = S.settings.catBudgets, ct = {};
  monthEntries(ym).forEach(function (e) { if (e.type === 'out') ct[e.cat] = (ct[e.cat] || 0) + e.amount; });
  var chips = Object.keys(cb).filter(function (c) { return cb[c] > 0 && (ct[c] || 0) >= cb[c] * 0.8; }).map(function (c) {
    var s2 = budgetState(ct[c] || 0, cb[c]);
    return '<span class="pill ' + s2 + '">' + esc(c) + ' ' + usePct(ct[c] || 0, cb[c]) + '% ' + STATE_LABEL[s2] + '</span>';
  });
  if (chips.length) h += '<div class="chips">' + chips.join('') + '</div>';
  return h + '</div>';
}

function ledgerHTML(list) {
  var groups = {}, h = '<section class="ledger" aria-label="날짜별 내역">';
  list.forEach(function (e) { (groups[e.date] = groups[e.date] || []).push(e); });
  Object.keys(groups).sort().reverse().forEach(function (date) {
    var g = groups[date].slice().reverse(), dt = totals(g), s = [];
    if (dt.out) s.push('−' + num(dt.out));
    if (dt.in) s.push('<span class="income">+' + num(dt.in) + '</span>');
    h += '<div class="day"><div class="day-head"><span>' + mdw(date) + '</span><span class="num">' + s.join(' ') + '</span></div><ul>';
    g.forEach(function (e) {
      var sub = [];
      if (e.memo) sub.push(esc(e.cat));
      if (e.pay) sub.push(e.pay === 'cash' ? '<span class="cash">현금</span>' : '카드');
      h += '<li><button class="row" data-action="edit" data-id="' + esc(e.id) + '" aria-label="' + esc((e.memo || e.cat) + ' ' + won(e.amount) + ' 고치기') + '">' +
        '<span class="mono ' + e.type + '" aria-hidden="true">' + esc(Array.from(e.cat)[0] || '?') + '</span>' +
        '<span class="row-main"><span class="row-title">' + esc(e.memo || e.cat) + (e.sample ? '<span class="sample-tag">예시</span>' : '') + '</span>' +
        (sub.length ? '<span class="row-sub">' + sub.join(' · ') + '</span>' : '') + '</span>' +
        '<span class="row-amt num ' + e.type + '">' + (e.type === 'out' ? '−' : '+') + num(e.amount) + '</span></button></li>';
    });
    h += '</ul></div>';
  });
  return h + '</section>';
}

function renderHome() {
  var list = monthEntries(ui.ym), t = totals(list), h = '';
  if (hasSample()) h += '<div class="notice"><div><strong>지금 보이는 내역은 예시예요</strong><p>첫 기록을 저장하면 예시는 자동으로 지워져요.</p></div><button class="btn-sm" data-action="clear-sample">예시 지우기</button></div>';
  h += installBanner();
  var real = S.entries.filter(function (e) { return !e.sample; }).length, lb = S.settings.lastBackup;
  if (real >= 20 && (!lb || (Date.now() - lb) > 30 * 864e5)) h += '<div class="notice warn"><div><strong>백업한 지 한 달이 넘었어요</strong><p>기록은 이 폰에만 있어요. 백업 파일을 하나 만들어 두세요.</p></div><button class="btn-sm" data-action="goto-settings">백업</button></div>';

  h += navHTML('home-prev', 'home-next', ymLabel(ui.ym), 'home-today', ui.ym >= curYM(), '이전 달', '다음 달');
  var net = t.in - t.out, p = payTotals(list);
  h += '<section class="card"><p class="eyebrow">' + mOf(ui.ym) + '월에 쓴 돈</p><p class="big num">' + won(t.out) + '</p>';
  if (t.out) h += '<p class="pay-line">카드 <b class="num">' + won(p.card) + '</b> · 현금 <b class="num">' + won(p.cash) + '</b>' + (p.none ? ' · 미선택 <b class="num">' + won(p.none) + '</b>' : '') + '</p>';
  h += '<dl class="kv"><div><dt>들어온 돈</dt><dd class="num income">' + won(t.in) + '</dd></div>' +
    '<div><dt>남은 돈 (수입−지출)</dt><dd class="num">' + (net < 0 ? '−' : '') + won(Math.abs(net)) + '</dd></div></dl>' +
    budgetHTML(t.out, ui.ym) + '</section>';

  if (!list.length) {
    h += '<div class="empty"><p class="empty-title">' + mOf(ui.ym) + '월에는 아직 기록이 없어요</p><p>' +
      (ui.ym < curYM() ? '지난 기록도 <b>+ 기록</b>을 눌러 이 달 날짜로 남길 수 있어요.' : '오른쪽 아래 <b>+ 기록</b> 버튼으로 시작해 보세요.') + '</p></div>';
  } else {
    h += '<p class="hint ledger-hint">' + ICON_EDIT + '항목을 누르면 금액·날짜·카테고리를 고치거나 지울 수 있어요.</p>';
    h += ledgerHTML(list);
  }
  $('view-home').innerHTML = h;
}

/* --- period --- */
function periodRange() {
  var sp = ui.sp;
  if (sp.mode === 'month') return { from: ui.ym + '-01', to: ui.ym + '-' + pad(daysIn(ui.ym)), label: ymLabel(ui.ym) };
  if (sp.mode === 'week') { var to = addDays(sp.ws, 6); return { from: sp.ws, to: to, label: md(sp.ws) + ' ~ ' + md(to) }; }
  var f = sp.from, t = sp.to;
  if (f > t) { var x = f; f = t; t = x; }
  return { from: f, to: t, label: f.slice(0, 4) !== t.slice(0, 4) ? f.replace(/-/g, '.') + ' ~ ' + t.replace(/-/g, '.') : md(f) + ' ~ ' + md(t) };
}
function elapsedDays(r) { var today = todayStr(); if (r.from > today) return 0; var end = r.to < today ? r.to : today; return diffDays(r.from, end) + 1; }

/* --- charts --- */
function topBar(x, y, w, hgt, r) {
  if (hgt <= 0) return '';
  r = Math.min(r, w / 2, hgt);
  var b = y + hgt;
  return 'M' + x + ',' + b + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + b + 'Z';
}
function barChart(o) {
  var vals = o.vals, n = vals.length, W = 340, H = 172, L = 36, R = 6, T = 18, B = 22, pw = W - L - R, ph = H - T - B;
  var mx = niceMax(Math.max.apply(null, vals.concat([o.ref || 0, 1])));
  var step = pw / n, bw = n <= 12 ? Math.min(30, step * 0.56) : Math.max(2, step - 2.5), rr = n <= 12 ? 4 : 3;
  var y = function (v) { return T + ph - v / mx * ph; };
  var s = '<svg class="chart' + (o.sel != null ? ' has-sel' : '') + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria) + '">';
  [0, mx / 2, mx].forEach(function (v) {
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    s += '<text x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + (v ? manwon(v) : '0') + '</text>';
  });
  if (o.ref) s += '<line class="ref" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.ref) + '" y2="' + y(o.ref) + '"/>';
  vals.forEach(function (v, i) {
    var cx = L + (i + 0.5) * step;
    s += '<path class="bar' + (o.sel === i ? ' sel' : '') + '" d="' + topBar(cx - bw / 2, y(v), bw, v / mx * ph, rr) + '"/>';
    if (o.labels[i]) s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(o.labels[i]) + '</text>';
    if (o.showVal && o.sel === i && v > 0) s += '<text class="val" x="' + cx + '" y="' + (y(v) - 6) + '" text-anchor="middle">' + manwon(v) + '</text>';
  });
  vals.forEach(function (v, i) { s += '<rect class="hit" data-chart="' + o.id + '" data-idx="' + i + '" x="' + (L + i * step) + '" y="' + T + '" width="' + step + '" height="' + ph + '"/>'; });
  return s + '</svg>';
}
function flowData(r, list) {
  var days = diffDays(r.from, r.to) + 1, mode = ui.sp.mode;
  if (days <= 62) {
    var vals = [], labels = [], keys = [], every = Math.ceil(days / 6);
    for (var i = 0; i < days; i++) {
      var date = addDays(r.from, i), d = parseD(date), dn = d.getDate();
      vals.push(0); keys.push(date);
      if (mode === 'week') labels.push(DOW[d.getDay()]);
      else if (mode === 'month') labels.push([1, 5, 10, 15, 20, 25].indexOf(dn) >= 0 || (i === days - 1 && dn - 25 >= 3) ? String(dn) : '');
      else labels.push(i % every === 0 ? (d.getMonth() + 1) + '/' + dn : '');
    }
    list.forEach(function (e) { if (e.type === 'out') vals[diffDays(r.from, e.date)] += e.amount; });
    return { unit: 'day', vals: vals, labels: labels, keys: keys };
  }
  var ms = [], m = r.from.slice(0, 7), last = r.to.slice(0, 7);
  while (m <= last && ms.length < 60) { ms.push(m); m = addMonth(m, 1); }
  var multiYear = ms[0].slice(0, 4) !== ms[ms.length - 1].slice(0, 4);
  var mv = ms.map(function () { return 0; });
  list.forEach(function (e) { if (e.type === 'out') { var k = ms.indexOf(e.date.slice(0, 7)); if (k >= 0) mv[k] += e.amount; } });
  return { unit: 'month', vals: mv, keys: ms, labels: ms.map(function (x, i) { if (ms.length > 12 && i % Math.ceil(ms.length / 8)) return ''; return multiYear ? x.slice(2, 4) + '.' + mOf(x) : mOf(x) + '월'; }) };
}

function renderStats() {
  var sp = ui.sp, r = periodRange(), list = entriesIn(r.from, r.to), t = totals(list), h = '';
  // period controls
  h += '<div class="period"><div class="seg" id="periodSeg">' +
    ['week', 'month', 'range'].map(function (m) { return '<button data-pmode="' + m + '" aria-pressed="' + (sp.mode === m) + '">' + { week: '주간', month: '월간', range: '기간 설정' }[m] + '</button>'; }).join('') + '</div>';
  if (sp.mode === 'month') h += navHTML('p-prev', 'p-next', r.label, 'p-today', ui.ym >= curYM(), '이전 달', '다음 달');
  else if (sp.mode === 'week') h += navHTML('p-prev', 'p-next', r.label, 'p-today', sp.ws >= weekStartOf(todayStr()), '이전 주', '다음 주');
  else {
    h += '<div class="range"><div class="range-row"><input type="date" id="rangeFrom" value="' + sp.from + '" max="' + todayStr() + '" aria-label="시작 날짜"><span>~</span><input type="date" id="rangeTo" value="' + sp.to + '" aria-label="끝 날짜"></div>' +
      '<div class="quick">' + [['7d', '최근 7일'], ['30d', '최근 30일'], ['lastm', '지난달'], ['3m', '최근 3개월'], ['year', '올해']].map(function (p) { return '<button data-preset="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div>';
  }
  h += '</div>';

  // summary
  var ed = elapsedDays(r), days = diffDays(r.from, r.to) + 1, net = t.in - t.out;
  h += '<section class="card"><div class="card-head"><h2>' + esc(r.label) + '</h2><span class="muted num">' + days + '일</span></div>' +
    '<div><p class="eyebrow">쓴 돈</p><p class="big num">' + won(t.out) + '</p></div>' +
    '<dl class="kv"><div><dt>들어온 돈</dt><dd class="num income">' + won(t.in) + '</dd></div><div><dt>수입−지출</dt><dd class="num">' + (net < 0 ? '−' : '') + won(Math.abs(net)) + '</dd></div></dl>' +
    (ed && t.out ? '<p class="hint">하루 평균 약 <b class="num">' + won(Math.round(t.out / ed / 100) * 100) + '</b> 썼어요' + (ed < days ? ' (오늘까지 ' + ed + '일 기준)' : '') + '.</p>' : '');
  if (sp.mode === 'month') h += budgetHTML(t.out, ui.ym);
  h += '</section>';

  // payment
  var p = payTotals(list);
  h += '<section class="card"><div class="card-head"><h2>카드 · 현금</h2><span class="muted">지출 기준</span></div>';
  if (!t.out) h += '<p class="hint">이 기간에는 지출 기록이 없어요.</p>';
  else {
    h += '<div class="split" aria-hidden="true">' + ['card', 'cash', 'none'].filter(function (k) { return p[k]; }).map(function (k) { return '<i class="k-' + k + '" style="width:' + (p[k] / t.out * 100).toFixed(1) + '%"></i>'; }).join('') + '</div>';
    var ppl = pctList([p.card, p.cash, p.none], t.out), pp = { card: ppl[0], cash: ppl[1], none: ppl[2] };
    h += '<ul class="cat-list">' + [['card', '카드'], ['cash', '현금'], ['none', '선택 안 함']].filter(function (k) { return k[0] !== 'none' || p.none; }).map(function (k) {
      return '<li><div class="cat-line"><span class="cat-name"><i class="dot k-' + k[0] + '"></i>' + k[1] + '</span><span class="num">' + won(p[k[0]]) + ' <span class="muted">· ' + pp[k[0]] + '%</span></span></div></li>';
    }).join('') + '</ul>';
  }
  h += '</section>';

  // categories
  var ct = sp.catType, cats = catTotals(list, ct), tot = ct === 'out' ? t.out : t.in, cb = S.settings.catBudgets;
  h += '<section class="card"><div class="card-head"><h2>카테고리별</h2><div class="seg mini">' +
    '<button data-cattype="out" aria-pressed="' + (ct === 'out') + '">지출</button><button data-cattype="in" aria-pressed="' + (ct === 'in') + '">수입</button></div></div>';
  if (!cats.length) h += '<p class="hint">이 기간에는 ' + (ct === 'out' ? '지출' : '수입') + ' 기록이 없어요.</p>';
  else {
    var mx = cats[0][1];
    h += '<ul class="cat-list">';
    var cps = pctList(cats.map(function (c) { return c[1]; }), tot);
    cats.forEach(function (c, ci) {
      var bud = ct === 'out' && sp.mode === 'month' ? (cb[c[0]] || 0) : 0, st = bud ? budgetState(c[1], bud) : 'ok';
      h += '<li><div class="cat-line"><span class="cat-name">' + esc(c[0]) + '</span><span class="num">' + won(c[1]) + '</span></div>' +
        '<div class="track"><i class="' + (ct === 'in' ? 'in' : st === 'over' ? 'over' : '') + '" style="width:' + (c[1] / mx * 100).toFixed(1) + '%"></i></div>' +
        '<div class="cat-meta"><span class="num">전체의 ' + cps[ci] + '%</span>' +
        (bud ? '<span class="num ' + (st === 'ok' ? '' : st) + '">예산 ' + won(bud) + '의 ' + usePct(c[1], bud) + '%</span>' : '') + '</div></li>';
    });
    h += '</ul>';
  }
  h += '</section>';

  // flow chart
  var fd = flowData(r, list), sel = ui.sel.flow != null && ui.sel.flow < fd.vals.length ? ui.sel.flow : null, b = S.settings.budget;
  var ref = b > 0 ? (fd.unit === 'day' ? b / daysIn(r.from.slice(0, 7)) : b) : 0, readout;
  if (sel != null) readout = '<b>' + (fd.unit === 'day' ? mdw(fd.keys[sel]) : ymLabel(fd.keys[sel])) + '</b> · <b class="num">' + won(fd.vals[sel]) + '</b>';
  else if (!t.out) readout = '<span class="muted">이 기간에는 지출 기록이 없어요.</span>';
  else {
    var mxv = Math.max.apply(null, fd.vals), mi = fd.vals.indexOf(mxv);
    readout = (fd.unit === 'day' ? '가장 많이 쓴 날 ' + md(fd.keys[mi]) : '가장 많이 쓴 달 ' + ymLabel(fd.keys[mi])) + ' <b class="num">' + won(mxv) + '</b>';
  }
  h += '<section class="card"><div class="card-head"><h2>' + (fd.unit === 'day' ? '날짜별 지출' : '월별 지출') + '</h2></div><p class="readout">' + readout + '</p>' +
    barChart({ id: 'flow', vals: fd.vals, labels: fd.labels, sel: sel, ref: ref, aria: r.label + ' 지출 막대 차트' });
  if (ref) h += '<div class="legend"><span><i></i>' + (fd.unit === 'day' ? '하루 예산 약 ' + won(Math.round(ref / 100) * 100) : '한 달 예산 ' + won(ref)) + '</span></div>';
  h += '<p class="hint">막대를 누르면 금액이 보여요.</p></section>';

  // 6-month trend (month mode)
  if (sp.mode === 'month') {
    var tm = []; for (var k = 5; k >= 0; k--) { var mm = addMonth(ui.ym, -k); tm.push({ ym: mm, v: totals(monthEntries(mm)).out }); }
    var ts = ui.sel.trend != null ? ui.sel.trend : 5, td = tm[ts];
    var tr = '<b>' + ymLabel(td.ym) + '</b> · <b class="num">' + won(td.v) + '</b>';
    if (b > 0 && td.v > 0) tr += td.v > b ? ' <span class="pill over">예산 초과</span>' : ' <span class="pill ok">예산 안</span>';
    h += '<section class="card"><div class="card-head"><h2>최근 6개월 지출</h2></div><p class="readout">' + tr + '</p>' +
      barChart({ id: 'trend', vals: tm.map(function (x) { return x.v; }), labels: tm.map(function (x) { return mOf(x.ym) + '월'; }), sel: ts, ref: b > 0 ? b : 0, showVal: true, aria: '최근 6개월 지출 막대 차트' });
    if (b > 0) h += '<div class="legend"><span><i></i>한 달 예산 ' + won(b) + '</span></div>';
    h += '</section>';

function budgetAlerts(entry, beforeList) {
  if (entry.type !== 'out') return null;
  var ym = entry.date.slice(0, 7), after = monthEntries(ym), b = S.settings.budget, msgs = [], worst = null;
  function cross(prev, now, bud, label) {
    if (!(bud > 0)) return;
    if (prev < bud && now >= bud) { msgs.push(label + ' 예산을 넘었어요 (' + won(now - bud) + ' 초과)'); worst = 'over'; }
    else if (prev < bud * 0.8 && now >= bud * 0.8) { msgs.push(label + ' 예산의 80%를 썼어요. ' + won(bud - now) + ' 남았어요'); worst = worst || 'warn'; }
  }
  cross(totals(beforeList).out, totals(after).out, b, mOf(ym) + '월');
  var catSum = function (l) { return sum(l, function (e) { return e.type === 'out' && e.cat === entry.cat ? e.amount : 0; }); };
  cross(catSum(beforeList), catSum(after), S.settings.catBudgets[entry.cat], entry.cat);
  return msgs.length ? { msg: msgs.join(' · '), kind: worst } : null;
}

}

/* ---------- files ---------- */
function deliver(name, mime, text, preferShare) {
  var blob = new Blob([text], { type: mime });
  if (preferShare) {
    try {
      var file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: name }).then(function () { return 'shared'; }, function (e) { return e && e.name === 'AbortError' ? 'cancel' : download(); });
      }
    } catch (e) {}
    toast('이 기기에서는 보내기를 쓸 수 없어 파일로 저장할게요.');
  }
  return Promise.resolve(download());
  function download() {
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return 'saved';
    } catch (e) { return 'fail'; }
  }
}
function doBackup(share) {
  if (framed) { toast('미리보기에서는 파일 저장이 막혀 있어요. 설치한 앱에서 해 주세요.', 'warn'); return; }
  var data = JSON.stringify({ app: 'gagyebu', v: 2, exportedAt: new Date().toISOString(), cats: S.cats, settings: S.settings, entries: S.entries.filter(function (e) { return !e.sample; }) }, null, 1);
  deliver('가계부_백업_' + todayStr() + '.json', 'application/json', data, share).then(function (r) {
    if (r === 'shared' || r === 'saved') {
      S.settings.lastBackup = Date.now(); save(); render();
      toast(r === 'shared' ? '백업 파일을 보냈어요.' : '백업 파일을 저장했어요. 다운로드 폴더를 확인해 주세요.');
    } else if (r === 'fail') toast('파일을 만들지 못했어요. 다시 시도해 주세요.', 'over');
  });
}
function doCSV() {
  if (framed) { toast('미리보기에서는 파일 저장이 막혀 있어요. 설치한 앱에서 해 주세요.', 'warn'); return; }
  var rows = [['날짜', '구분', '카테고리', '결제수단', '금액', '메모']];
  S.entries.filter(function (e) { return !e.sample; }).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function (e) {
    rows.push([e.date, e.type === 'out' ? '지출' : '수입', e.cat, PAY[e.pay] || '', e.type === 'out' ? -e.amount : e.amount, e.memo]);
  });
  if (rows.length === 1) { toast('내보낼 기록이 아직 없어요.'); return; }
  var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  deliver('가계부_' + todayStr() + '.csv', 'text/csv', csv, true).then(function (r) {
    if (r === 'shared') toast('엑셀 파일을 보냈어요.');

    S.settings.name = $('nameInput').value.trim();
    var custom = $('titleInput').value.trim();
    if (custom) S.settings.title = custom;
    save(); render(); toast('이름과 타이틀을 저장했어요.');
  }
  else if (a === 'save-budget') { S.settings.budget = digits($('budgetInput').value); S.settings.sampleSettings = false; save(); render(); toast(S.settings.budget ? '한 달 예산을 ' + won(S.settings.budget) + '으로 정했어요.' : '예산을 껐어요.'); }
  else if (a === 'save-catbudgets') {
    var cb = {}; document.querySelectorAll('.cb-list input').forEach(function (inp) { var v = digits(inp.value); if (v) cb[inp.dataset.cb] = v; });
    S.settings.catBudgets = cb; S.settings.sampleSettings = false; ui.cbOpen = true; save(); render(); toast('카테고리 예산을 저장했어요.');
  }
  else if (a === 'backup') doBackup(false);
  else if (a === 'backup-share') doBackup(true);
  else if (a === 'csv') doCSV();
  else if (a === 'restore') $('restoreFile').click();
  else if (a === 'restore-cancel') { ui.restoreData = null; render(); }
  else if (a === 'restore-yes') { S = ui.restoreData; ui.restoreData = null; save(); ui.ym = curYM(); render(); toast('백업에서 복원했어요.'); }
  else if (a === 'add-cat') {
    var name = $('newCat').value.trim();
    if (!name) return;
    if (S.cats[ui.catTab].indexOf(name) >= 0) { toast('이미 있는 카테고리예요.'); return; }
    S.cats[ui.catTab].push(name); save(); render(); toast('"' + name + '" 카테고리를 추가했어요.');
  }
  else if (a === 'del-cat') {
    var list = S.cats[ui.catTab];
    if (list.length <= 1) { toast('카테고리는 하나 이상 있어야 해요.'); return; }
    var removed = list.splice(Number(t.dataset.i), 1)[0];
    if (S.settings.catBudgets[removed]) delete S.settings.catBudgets[removed];
    save(); render(); toast('"' + removed + '" 카테고리를 지웠어요.');
  }
  else if (a === 'wipe') { ui.confirm = 'wipe'; render(); }
  else if (a === 'wipe-cancel') { ui.confirm = null; render(); }
  else if (a === 'wipe-yes') { var keep = { name: S.settings.name, title: S.settings.title }; S = freshState(false); Object.assign(S.settings, keep); ui.confirm = null; save(); render(); toast('모든 기록을 지웠어요.'); }
});
$('scrim').addEventListener('click', function () { closeSheet(); });
$('fab').addEventListener('click', function () { openSheet(null); });
$('entryForm').addEventListener('submit', submitEntry);
$('delBtn').addEventListener('click', function () {
  if (!form.delArmed) { form.delArmed = true; $('delBtn').textContent = '한 번 더 누르면 삭제'; setTimeout(function () { form.delArmed = false; if (!$('delBtn').hidden) $('delBtn').textContent = '삭제'; }, 3000); return; }
  S.entries = S.entries.filter(function (e) { return e.id !== form.id; });
  save(); closeSheet(); render(); toast('기록을 지웠어요.');
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'amount' || el.id === 'budgetInput' || (el.dataset && el.dataset.cb !== undefined)) {
    var v = digits(el.value); el.value = v ? num(v) : '';
    if (el.id === 'amount') $('formError').hidden = true;
  }
  if (el.id === 'date') { updateDateUI(); $('formError').hidden = true; }
  if (el.id === 'memo' && !form.catTouched) {
    var m = el.value.trim();
    if (!m) return;
    var hit = S.entries.slice().reverse().find(function (x) { return x.type === form.type && x.memo === m && S.cats[form.type].indexOf(x.cat) >= 0; });
    if (hit && hit.cat !== form.cat) { form.cat = hit.cat; if (hit.pay) form.pay = hit.pay; renderCatGrid(); }
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if ((el.id === 'rangeFrom' || el.id === 'rangeTo') && el.value) {
    ui.sp[el.id === 'rangeFrom' ? 'from' : 'to'] = el.value;
    if (ui.sp.from > ui.sp.to) { var x = ui.sp.from; ui.sp.from = ui.sp.to; ui.sp.to = x; }
    ui.sel.flow = null; renderStats();
  }
  if (el.id === 'date') updateDateUI();
});
document.addEventListener('toggle', function (e) {
  if (e.target.id === 'cbDetails') ui.cbOpen = e.target.open;
  if (e.target.id === 'periodFold') ui.foldOpen = e.target.open;
}, true);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && sheetOpen) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'newCat') { e.preventDefault(); var b = document.querySelector('[data-action="add-cat"]'); if (b) b.click(); }
});
// keep "today" correct if the app stays open past midnight
document.addEventListener('visibilitychange', function () {
  if (document.hidden || sheetOpen) return;
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT')) return;
  render();
});

render();

if ('serviceWorker' in navigator && !framed && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
</script>
</body>
</html>
